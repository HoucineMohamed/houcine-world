name: Check Cursor Fix Deploy

# One-off, manually triggered only. Confirms the workspace cursor fix
# actually reached the live Netlify build — searches the live CSS bundle for
# "workspace-active" (verified unique: zero occurrences anywhere before this
# change, exactly two after, per the commit message).

on:
  workflow_dispatch: {}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Verify the deployed CSS contains the workspace-active cursor override
        run: |
          set -uo pipefail
          base="https://houcineworld.netlify.app"
          index=$(curl -sS --max-time 20 -L "$base")
          css_path=$(echo "$index" | grep -o '/assets/index-[A-Za-z0-9_-]*\.css' | head -1)
          if [ -z "$css_path" ]; then
            echo "::error::Could not find the main CSS bundle path in index.html"; exit 1
          fi
          echo "Live CSS bundle: $css_path"
          curl -sS --max-time 30 -L -o /tmp/live_bundle.css "${base}${css_path}"
          if grep -q "workspace-active" /tmp/live_bundle.css; then
            echo "VERIFIED: live CSS contains the workspace-active cursor override — this deploy includes the fix."
            grep -o "workspace-active[^}]*}" /tmp/live_bundle.css
          else
            echo "::error::Marker not found in the live CSS bundle — the new build may not have deployed yet."
            exit 1
          fi
