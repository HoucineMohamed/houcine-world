name: Check Project Split

# One-off, manually triggered only. .env now points at uxixfhthdgwxqfltvudt
# while supabase/config.toml still says pcdkfpardswfwoiclvtm — checking what
# each project actually contains before touching anything else. Read-only.

on:
  workflow_dispatch: {}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Probe both project refs via the Management API
        run: |
          set -uo pipefail
          for ref in pcdkfpardswfwoiclvtm uxixfhthdgwxqfltvudt; do
            echo "::group::Project $ref — config/auth (proves the token can even see this project)"
            status=$(curl -sS -o /tmp/resp.json -w '%{http_code}' \
              "https://api.supabase.com/v1/projects/$ref/config/auth" \
              -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN")
            echo "HTTP $status"
            cat /tmp/resp.json
            echo
            echo "::endgroup::"

            echo "::group::Project $ref — tables in public schema"
            payload=$(jq -n '{query: "select table_name from information_schema.tables where table_schema = '\''public'\'' order by table_name;"}')
            status=$(curl -sS -o /tmp/tables.json -w '%{http_code}' -X POST \
              "https://api.supabase.com/v1/projects/$ref/database/query" \
              -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" -H "Content-Type: application/json" \
              --data-binary "$payload")
            echo "HTTP $status"
            cat /tmp/tables.json
            echo
            echo "::endgroup::"
          done
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
