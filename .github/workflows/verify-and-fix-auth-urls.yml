name: Verify Netlify URL and Fix Auth Config

# One-off, manually triggered only. Gated steps:
#   1. Really fetch houcineworld.netlify.app and its /auth/callback route,
#      confirm both genuinely serve this app — matches the real
#      <title>Houcine.world</title> from index.html, not a platform 404 page.
#      Fails the job if it doesn't check out, so the Auth config PATCH never
#      runs on an unverified state.
#   2. Only if verified: PATCH config/auth to site_url/uri_allow_list =
#      Netlify only — Netlify is now the sole live deployment for this
#      project (Vercel's own deployment/config is untouched, just no longer
#      an Auth target), and any leftover Vercel/Lovable editor entries are
#      dropped. Re-reads the config back afterward as real proof it changed.

on:
  workflow_dispatch: {}

env:
  SUPABASE_PROJECT_REF: pcdkfpardswfwoiclvtm
  NETLIFY_URL: https://houcineworld.netlify.app

permissions:
  contents: read

jobs:
  verify-and-fix:
    runs-on: ubuntu-latest
    steps:
      - name: Verify Netlify actually serves this app, including /auth/callback
        run: |
          set -uo pipefail
          FAIL=0
          base="$NETLIFY_URL"

          : > /tmp/root.html
          root_status=$(curl -sS -o /tmp/root.html -w '%{http_code}' --max-time 20 -L "$base" || echo "000")
          echo "root: HTTP $root_status"
          if grep -q '<title>Houcine.world</title>' /tmp/root.html; then
            echo "root: title matches Houcine.world — real app content confirmed"
            root_ok=true
          else
            echo "root: title did NOT match — showing first 300 bytes for inspection:"
            head -c 300 /tmp/root.html
            echo
            root_ok=false
          fi

          : > /tmp/callback.html
          cb_status=$(curl -sS -o /tmp/callback.html -w '%{http_code}' --max-time 20 -L "${base}/auth/callback" || echo "000")
          echo "auth/callback: HTTP $cb_status"
          if grep -q '<title>Houcine.world</title>' /tmp/callback.html; then
            echo "auth/callback: title matches — SPA fallback confirmed working, real app served instead of a 404"
            cb_ok=true
          else
            echo "auth/callback: title did NOT match — showing first 300 bytes:"
            head -c 300 /tmp/callback.html
            echo
            cb_ok=false
          fi

          if [ "$root_status" = "200" ] && [ "$root_ok" = true ] && [ "$cb_status" = "200" ] && [ "$cb_ok" = true ]; then
            echo "VERIFIED: $base is live and serving the real app, including /auth/callback."
          else
            echo "::error::$base did NOT verify — root_status=$root_status root_ok=$root_ok cb_status=$cb_status cb_ok=$cb_ok"
            echo "::error::Refusing to touch Auth config until this passes (Netlify may still be deploying — re-run in a bit)."
            exit 1
          fi

      - name: Before — current Auth config
        run: |
          set -euo pipefail
          curl -sS "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_REF/config/auth" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" | jq '{site_url, uri_allow_list}'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Update Auth config — Netlify only
        run: |
          set -euo pipefail
          allow_list="${NETLIFY_URL}/**"
          payload=$(jq -n --arg site "$NETLIFY_URL" --arg allow "$allow_list" '{site_url: $site, uri_allow_list: $allow}')
          status=$(curl -sS -o /tmp/patch_resp.json -w '%{http_code}' -X PATCH \
            "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_REF/config/auth" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" -H "Content-Type: application/json" \
            --data-binary "$payload")
          echo "PATCH HTTP $status"
          if [ "$status" -ge 300 ]; then
            echo "::error::PATCH failed"; cat /tmp/patch_resp.json; exit 1
          fi
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: After — re-read Auth config to confirm it actually changed
        run: |
          set -euo pipefail
          after=$(curl -sS "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_REF/config/auth" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN")
          echo "$after" | jq '{site_url, uri_allow_list}'
          got_site=$(echo "$after" | jq -r '.site_url')
          got_allow=$(echo "$after" | jq -r '.uri_allow_list')
          if [ "$got_site" != "$NETLIFY_URL" ]; then
            echo "::error::site_url did not stick: got '$got_site'"; exit 1
          fi
          if [ "$got_allow" != "${NETLIFY_URL}/**" ]; then
            echo "::error::uri_allow_list is not exactly Netlify-only: got '$got_allow'"; exit 1
          fi
          echo "Confirmed: site_url and uri_allow_list both hold only the verified Netlify URL — no Vercel or Lovable entries remain."
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
