# auto-merge: squash-merge an open pull request only if EVERY rule in
# scripts/ci/automerge-decision.mjs holds; otherwise do nothing, or add the "needs-owner" label and
# one comment for critical changes. Never deletes branches. See docs/automation.md.
#
# Triggers:
#   - workflow_run: right after a CI run completes (judges the pull request for that commit);
#   - schedule (every 15 minutes) and workflow_dispatch ("Run workflow" in the Actions tab):
#     re-judge EVERY open pull request labelled "auto", for when CI finished earlier or the Netlify
#     preview reported late.
# workflow_run and schedule always use the DEFAULT branch's copy of this file; the job checks out
# the default branch's scripts, and a manual run is only accepted from the default branch, so a
# pull request cannot change the rules that judge it.
name: auto-merge

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  checks: read
  statuses: read

concurrency:
  group: auto-merge-${{ github.event.workflow_run.head_sha || 'scheduled' }}
  cancel-in-progress: false

jobs:
  decide-and-merge:
    if: >-
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.head_repository.full_name == github.repository &&
       startsWith(github.event.workflow_run.head_branch, 'claude/')) ||
      github.event_name == 'schedule' ||
      (github.event_name == 'workflow_dispatch' &&
       github.ref == format('refs/heads/{0}', github.event.repository.default_branch))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - uses: actions/github-script@v7
        with:
          script: |
            const { runAutoMerge, runScheduled } = await import(`${process.env.GITHUB_WORKSPACE}/scripts/ci/automerge-run.mjs`);
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const now = () => new Date();
            let outcomes;
            if (context.eventName === "workflow_run") {
              const run = context.payload.workflow_run;
              outcomes = await runAutoMerge({
                github, owner, repo, now,
                run: { head_sha: run.head_sha, conclusion: run.conclusion },
                sleep: (ms) => new Promise((resolve) => setTimeout(resolve, ms)),
                log: (line) => core.info(line),
              });
            } else {
              outcomes = await runScheduled({ github, owner, repo, now });
            }
            for (const o of outcomes) {
              core.info(`#${o.prNumber ?? "-"}: ${o.action}${o.reasons.length ? ` (${o.reasons.join("; ")})` : ""}`);
            }
            await core.summary
              .addHeading(`auto-merge (${context.eventName})`)
              .addTable([
                [{ data: "Pull request", header: true }, { data: "Outcome", header: true }, { data: "Reasons", header: true }],
                ...outcomes.map((o) => [String(o.prNumber ?? "-"), o.action, o.reasons.join("; ") || "-"]),
              ])
              .write();
