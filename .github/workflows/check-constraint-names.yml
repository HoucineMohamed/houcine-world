name: Check Constraint Names

# One-off diagnostic, manually triggered only. Confirms the exact
# auto-generated CHECK constraint names on connected_accounts,
# platform_metrics_snapshots, and platform_credentials before writing an
# ALTER migration for them — guessing Postgres's auto-generated names would
# risk a failed migration.

on:
  workflow_dispatch: {}

env:
  SUPABASE_PROJECT_REF: pcdkfpardswfwoiclvtm

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Query pg_constraint for the three platform-list check constraints
        run: |
          set -euo pipefail
          MGMT_API="https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_REF/database/query"
          payload=$(jq -n '{query: "select conrelid::regclass as table_name, conname, pg_get_constraintdef(oid) as definition from pg_constraint where conrelid in ('\''public.connected_accounts'\''::regclass, '\''public.platform_metrics_snapshots'\''::regclass, '\''public.platform_credentials'\''::regclass) and contype = '\''c'\'' order by table_name;"}')
          curl -sS -X POST "$MGMT_API" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" -H "Content-Type: application/json" \
            -d "$payload" | jq .
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
