name: Check Auth Config Status

# One-off diagnostic, manually triggered only (never on push): reports the
# live project's Auth service config (Site URL / Redirect URLs — these live
# at the Auth-service level, not in Postgres, so no migration or `db push`
# ever touches them) plus the real row state of profiles/brand_admins/brands,
# to find out why magic-link login stopped working after the project-ref
# switch. Read-only. Same Management API + SUPABASE_ACCESS_TOKEN approach as
# the deploy workflow, no DB password. No secret VALUES are ever printed —
# only Auth URL config (not sensitive) and boolean/id-level table contents.

on:
  workflow_dispatch: {}

env:
  SUPABASE_PROJECT_REF: pcdkfpardswfwoiclvtm

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Report Auth config + admin data state
        run: |
          set -euo pipefail
          MGMT_API="https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_REF"
          WORKDIR=$(mktemp -d)

          run_sql() {
            local q="$1"
            local payload="$WORKDIR/payload.json" resp="$WORKDIR/resp.txt"
            jq -n --arg q "$q" '{query: $q}' > "$payload"
            local status
            status=$(curl -sS -o "$resp" -w '%{http_code}' -X POST "$MGMT_API/database/query" \
              -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" -H "Content-Type: application/json" \
              --data-binary "@$payload")
            if [ "$status" -ge 300 ]; then
              echo "::error::query failed (HTTP $status)"; cat "$resp"; exit 1
            fi
            cat "$resp"
          }

          echo "::group::Auth service config (Site URL / Redirect URLs)"
          curl -sS "$MGMT_API/config/auth" -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            -o "$WORKDIR/auth_config.json"
          jq '{site_url, uri_allow_list, external_email_enabled, mailer_autoconfirm, disable_signup}' "$WORKDIR/auth_config.json"
          echo "::endgroup::"

          echo "::group::profiles table"
          run_sql "select id, email, platform_role, created_at from public.profiles order by created_at;"
          echo "::endgroup::"

          echo "::group::brands table"
          run_sql "select id, slug, name, status from public.brands order by created_at;"
          echo "::endgroup::"

          echo "::group::brand_admins table"
          run_sql "select user_id, brand_id, role from public.brand_admins;"
          echo "::endgroup::"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
