name: Check Meta Business Endpoints

# One-off, manually triggered only. Confirms meta-business-token and
# meta-business-metrics are actually deployed and reachable, and that an
# unauthenticated call returns the same error shape/status as a sibling
# platform's already-working endpoint (facebook-metrics) — step 2 of the
# Meta Business Suite task asks for exactly this before moving on.

on:
  workflow_dispatch: {}

env:
  SUPABASE_URL: https://pcdkfpardswfwoiclvtm.supabase.co
  # This is the publishable/anon key from .env — safe to inline, it's already
  # baked into the public client-side bundle by design (not a secret).
  ANON_KEY: sb_publishable_8E0mnb2b-qvUSffU_1nuBg_hIY04YcA

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Curl each endpoint unauthenticated (apikey only, no user JWT)
        run: |
          set -uo pipefail
          check() {
            local name="$1" path="$2"
            echo "::group::$name"
            resp=$(curl -sS --max-time 20 -w '\n%{http_code}' -X POST \
              "$SUPABASE_URL/functions/v1/$path" \
              -H "apikey: $ANON_KEY" \
              -H "Content-Type: application/json" \
              -d '{"brand_id":"00000000-0000-0000-0000-000000000000"}')
            code=$(echo "$resp" | tail -1)
            body=$(echo "$resp" | sed '$d')
            echo "HTTP $code"
            echo "$body"
            echo "::endgroup::"
          }
          check "facebook-metrics (sibling, for comparison)" "facebook-metrics"
          check "meta-business-token" "meta-business-token"
          check "meta-business-metrics" "meta-business-metrics"
