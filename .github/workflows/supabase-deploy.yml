name: Deploy Supabase

# Runs the Supabase migration + every edge function against the live project
# on every push to main. GitHub's runners have normal internet access, unlike
# the Claude Code session this was authored in — that session cannot reach
# supabase.co at all, which is why this exists instead of a manual CLI run.
#
# Required repository secrets (Settings → Secrets and variables → Actions):
#   SUPABASE_ACCESS_TOKEN  — personal access token, authenticates both the CLI
#                            (link, functions deploy) and the Management API
#                            calls below (supabase.com/dashboard/account/tokens).
#                            No database password is used anywhere in this
#                            workflow: migrations are applied by POSTing their
#                            SQL to the Management API's database/query
#                            endpoint over HTTPS, authenticated with this same
#                            token, instead of opening a direct Postgres
#                            connection.

#
# What it deploys (unchanged by the hardening pull request; listed here so a reader does not have to work it out):
#   1. Every pending SQL file in supabase/migrations/, in name order, each in its own transaction.
#   2. These edge functions, and only these: instagram, tiktok, spotify, soundcloud, youtube and facebook
#      (each an -oauth and a -metrics function), meta-business-token, meta-business-metrics,
#      platform-credentials, concierge (the La Rosa View Concierge: deploying it on every merge is how an
#      updated knowledge brain reaches the live chat, docs/knowledge-brain.md) and knowledge-studio (the owner's
#      Knowledge Studio backend, docs/knowledge-studio.md) and command-analyst (the Command Center's read-only AI
#      management analyst, docs/command-center.md) and autopilot (Autopilot's AI side, docs/autopilot.md). NOT deployed here:
#      send-notification and seed-admins (deployed by hand, from the Supabase dashboard or by adding their name
#      to the list in the last step; docs/owner-review-guide.md).
#
# The first step stops the run with a plain message when SUPABASE_ACCESS_TOKEN is missing, expired or wrong,
# before anything is linked or deployed.

on:
  push:
    branches: [main]
  workflow_dispatch: {}

env:
  SUPABASE_PROJECT_REF: pcdkfpardswfwoiclvtm

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check the access token
        # Fails loudly, with what to do, instead of an unclear error in a later step. The token is sent only to
        # api.supabase.com (the host this workflow already uses) and is never printed.
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_ACCESS_TOKEN:-}" ]; then
            echo "::error title=SUPABASE_ACCESS_TOKEN is missing::Add it in GitHub: Settings > Secrets and variables > Actions > New repository secret, name SUPABASE_ACCESS_TOKEN, value: a token from supabase.com/dashboard/account/tokens. Nothing was deployed."
            exit 1
          fi
          status=$(curl -sS --max-time 20 -o /dev/null -w '%{http_code}' "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_REF" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN") || status="000"
          case "$status" in
            200) echo "The access token works for project $SUPABASE_PROJECT_REF." ;;
            401|403) echo "::error title=SUPABASE_ACCESS_TOKEN is invalid or expired (HTTP $status)::Create a new token at supabase.com/dashboard/account/tokens, then replace the secret in GitHub: Settings > Secrets and variables > Actions > SUPABASE_ACCESS_TOKEN > Update. Nothing was deployed."; exit 1 ;;
            404) echo "::error title=Project not found (HTTP 404)::The token works but cannot see project $SUPABASE_PROJECT_REF. Use a token from the account that owns the project. Nothing was deployed."; exit 1 ;;
            *) echo "::error title=Could not check the access token (HTTP $status)::api.supabase.com did not answer as expected. Re-run the workflow later. Nothing was deployed."; exit 1 ;;
          esac
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link project
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Apply pending migrations via Management API
        # Runs each supabase/migrations/*.sql file over HTTPS via
        # api.supabase.com's database/query endpoint, authenticated with the
        # access token — no direct Postgres connection, no DB password. A
        # supabase_migrations.schema_migrations tracking table (the same
        # name/shape the CLI itself uses) records which versions have already
        # run, so this is safe to run on every push: already-applied
        # migrations are skipped, and each new one runs in its own
        # begin/commit alongside the row that marks it applied.
        run: |
          set -euo pipefail
          API="https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_REF/database/query"
          WORKDIR=$(mktemp -d)

          run_sql() {
            # $1 = path to a file containing the SQL to run, $2 = label for errors
            local sql_file="$1" label="$2"
            local payload="$WORKDIR/payload.json" resp="$WORKDIR/resp.txt"
            jq -n --rawfile q "$sql_file" '{query: $q}' > "$payload"
            local status
            status=$(curl -sS -o "$resp" -w '%{http_code}' -X POST "$API" \
              -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
              -H "Content-Type: application/json" \
              --data-binary "@$payload")
            if [ "$status" -ge 300 ]; then
              echo "::error::Management API call failed for $label (HTTP $status)"
              cat "$resp"
              exit 1
            fi
            cat "$resp"
          }

          echo "::group::Ensuring migration tracking table exists"
          printf '%s\n' \
            'create schema if not exists supabase_migrations;' \
            'create table if not exists supabase_migrations.schema_migrations (' \
            '  version text primary key,' \
            '  name text not null,' \
            '  applied_at timestamptz not null default now()' \
            ');' \
            > "$WORKDIR/init.sql"
          run_sql "$WORKDIR/init.sql" "tracking table setup" > /dev/null
          echo "::endgroup::"

          run_sql <(echo "select version from supabase_migrations.schema_migrations order by version;") \
            "list applied migrations" > "$WORKDIR/applied.json"
          echo "Already applied: $(jq -r '[.[].version] | join(", ")' "$WORKDIR/applied.json")"

          for f in supabase/migrations/*.sql; do
            base=$(basename "$f")
            version="${base%%_*}"
            if jq -e --arg v "$version" 'any(.[]; .version == $v)' "$WORKDIR/applied.json" > /dev/null; then
              echo "Skipping already-applied migration $base"
              continue
            fi
            echo "::group::Applying $base"
            {
              echo "begin;"
              cat "$f"
              printf "\ninsert into supabase_migrations.schema_migrations (version, name) values ('%s', '%s');\n" \
                "$version" "$base"
              echo "commit;"
            } > "$WORKDIR/migration.sql"
            run_sql "$WORKDIR/migration.sql" "$base" > /dev/null
            echo "Applied $base"
            echo "::endgroup::"
          done

          echo "::group::Verifying expected tables exist"
          printf '%s\n' \
            "select table_name from information_schema.tables" \
            "where table_schema = 'public'" \
            "  and table_name in ('connected_accounts','connected_account_secrets','oauth_flow_states','platform_metrics_snapshots','platform_credentials')" \
            "order by table_name;" \
            > "$WORKDIR/verify.sql"
          run_sql "$WORKDIR/verify.sql" "verify expected tables" > "$WORKDIR/verify.json"
          echo "Tables found: $(jq -r '[.[].table_name] | join(", ")' "$WORKDIR/verify.json")"
          for t in connected_accounts connected_account_secrets oauth_flow_states platform_metrics_snapshots platform_credentials; do
            if ! jq -e --arg t "$t" 'any(.[]; .table_name == $t)' "$WORKDIR/verify.json" > /dev/null; then
              echo "::error::expected table '$t' is missing after migrations"
              exit 1
            fi
          done
          echo "All 5 expected tables confirmed present in public schema."
          echo "::endgroup::"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Deploy edge functions
        run: |
          set -euo pipefail
          for fn in \
            instagram-oauth instagram-metrics \
            tiktok-oauth tiktok-metrics \
            spotify-oauth spotify-metrics \
            soundcloud-oauth soundcloud-metrics \
            youtube-oauth youtube-metrics \
            facebook-oauth facebook-metrics \
            meta-business-token meta-business-metrics \
            platform-credentials \
            concierge knowledge-studio command-analyst autopilot; do
            echo "::group::Deploying $fn"
            supabase functions deploy "$fn" --project-ref "$SUPABASE_PROJECT_REF"
            echo "::endgroup::"
          done
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
