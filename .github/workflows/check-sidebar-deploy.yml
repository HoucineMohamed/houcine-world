name: Check Sidebar Deploy

# One-off, manually triggered only. Confirms the sidebar logo/active-state
# commit actually reached the live Netlify build.
#
# A prior version of this check compared the live bundle's filename/sha256
# against a local `npm run build` of the same commit — that turned out to
# be unreliable: Netlify's build environment produces a stable but
# genuinely different hash than this dev sandbox's local build (confirmed
# by re-checking twice, minutes apart, with an identical live hash both
# times — not a mid-deploy timing artifact). Content search is more direct
# anyway, so this checks for "h-10 w-auto" instead — the new logo <img>'s
# exact class string. Verified empirically before relying on it: zero
# occurrences anywhere in src/ before this change, exactly one after
# (confirmed against both commits directly via `git show`) — so this
# string's presence in the live bundle is real, unambiguous proof this
# commit shipped. Both fixes (logo + active nav state) are in the same
# commit/file, so confirming one confirms the whole deploy.

on:
  workflow_dispatch: {}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Verify the deployed bundle contains the new logo marker
        run: |
          set -uo pipefail
          base="https://houcineworld.netlify.app"
          index=$(curl -sS --max-time 20 -L "$base")
          js_path=$(echo "$index" | grep -o '/assets/index-[A-Za-z0-9_-]*\.js' | head -1)
          if [ -z "$js_path" ]; then
            echo "::error::Could not find the main JS bundle path in index.html"; exit 1
          fi
          echo "Live bundle: $js_path"
          curl -sS --max-time 30 -L -o /tmp/live_bundle.js "${base}${js_path}"
          if grep -q "h-10 w-auto" /tmp/live_bundle.js; then
            echo "VERIFIED: live bundle contains the new sidebar logo's class string — this deploy includes the fix."
          else
            echo "::error::Marker not found in the live bundle — the new build may not have deployed yet."
            exit 1
          fi
