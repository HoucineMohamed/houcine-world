name: Check Live URL and Auth Config

# One-off diagnostic, manually triggered only. Investigating a "Lovable
# proxy error (404)" on the magic-link callback: pulls the current Auth
# site_url/uri_allow_list, and separately probes candidate live-URL
# candidates (the .lovableproject.com preview domain currently configured,
# Lovable's separate .lovable.app published-app domain, and the
# houcine.world custom domain) to see which one actually serves the real
# app right now. Read-only against Supabase; the URL probes are plain GETs
# against public pages, no auth involved.

on:
  workflow_dispatch: {}

env:
  SUPABASE_PROJECT_REF: pcdkfpardswfwoiclvtm

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Current Auth config
        run: |
          set -euo pipefail
          curl -sS "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_REF/config/auth" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" | jq '{site_url, uri_allow_list}'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Probe candidate live URLs
        run: |
          set -uo pipefail
          for url in \
            "https://14380d52-15b8-4038-8aa3-b77e47ae090c.lovableproject.com" \
            "https://14380d52-15b8-4038-8aa3-b77e47ae090c.lovable.app" \
            "https://houcine.world" \
            "https://www.houcine.world" \
            "https://houcine-world.lovable.app" \
            "https://houcineworld.lovable.app" \
            "https://la-rosa-view.lovable.app" \
            "https://larosaview.lovable.app" \
            "https://houcine.lovable.app" ; do
            echo "::group::$url"
            : > /tmp/resp.html
            curl -sS -o /tmp/resp.html -w "HTTP %{http_code} | final_url: %{url_effective} | content-type: %{content_type}\n" \
              --max-time 20 -L "$url" || echo "curl failed"
            echo "--- first 500 bytes of body ---"
            head -c 500 /tmp/resp.html
            echo
            echo "--- <title> if present ---"
            grep -o '<title>[^<]*</title>' /tmp/resp.html || echo "(no title tag found)"
            echo "::endgroup::"
          done

      - name: Probe the auth callback path directly on each candidate
        run: |
          set -uo pipefail
          for base in \
            "https://14380d52-15b8-4038-8aa3-b77e47ae090c.lovableproject.com" \
            "https://14380d52-15b8-4038-8aa3-b77e47ae090c.lovable.app" \
            "https://houcine.world" ; do
            url="${base}/auth/callback"
            echo "::group::$url"
            curl -sS -o /tmp/resp2.html -w "HTTP %{http_code} | content-type: %{content_type}\n" \
              --max-time 20 -L "$url" || echo "curl failed"
            head -c 300 /tmp/resp2.html
            echo
            echo "::endgroup::"
          done
