<!doctype html>
<!--
  Houcine.world fallback page (docs/fallback.md). Served:
  - when the app cannot start in the browser (public/boot-watchdog.js sends the visitor here, with ?return=<path>);
  - for every address while maintenance mode is switched on (the commented rule in public/_redirects).
  It is ONE self-contained file on purpose: the styles are inline and the logo (src/assets/logo-h.png, resized to
  240 px) is embedded, so it needs no other file, no web font, no app code, no Supabase and no outside host.
  The message is plain HTML and shows even without JavaScript; the small script only adds the "back" check.
  data-houcine-fallback marks this page, so the check can tell it apart from the real app.
-->
<html lang="en" data-houcine-fallback="1">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#000000" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Houcine.world</title>
    <meta name="description" content="Houcine is working behind the scenes to improve your experience." />
    <style>
      :root {
        /* The site's tokens (src/index.css, src/design/tokens.json): background 0 0% 0%, foreground 0 0% 96%,
           muted-foreground 0 0% 65%, border 0 0% 14%, accent and ring 0 0% 80%. */
        --background: hsl(0 0% 0%);
        --foreground: hsl(0 0% 96%);
        --muted: hsl(0 0% 65%);
        --border: hsl(0 0% 14%);
        --accent: hsl(0 0% 80%);
        --card: hsl(0 0% 5%);
        --font-display: "Space Grotesk", "Poppins", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        --font-sans: "Poppins", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        color-scheme: dark;
      }
      *, *::before, *::after { box-sizing: border-box; }
      html, body { margin: 0; min-height: 100%; background: var(--background); color: var(--foreground); }
      body {
        font-family: var(--font-sans);
        line-height: 1.6;
        -webkit-font-smoothing: antialiased;
        min-height: 100vh;
        min-height: 100dvh;
        display: flex;
        flex-direction: column;
        overflow-x: hidden;
        position: relative;
      }
      /* Ambient light: two very soft radial glows in the site's neutral greys. */
      .ambient { position: fixed; inset: 0; pointer-events: none; z-index: 0; overflow: hidden; }
      .ambient::before, .ambient::after {
        content: ""; position: absolute; border-radius: 50%; filter: blur(10px);
      }
      .ambient::before {
        width: 70vmax; height: 70vmax; left: 50%; top: 42%; transform: translate(-50%, -50%);
        background: radial-gradient(circle, hsl(0 0% 100% / 0.07) 0%, hsl(0 0% 100% / 0.025) 35%, transparent 65%);
        animation: breathe 9s ease-in-out infinite;
      }
      .ambient::after {
        width: 50vmax; height: 50vmax; right: -15vmax; bottom: -20vmax;
        background: radial-gradient(circle, hsl(215 25% 70% / 0.06) 0%, transparent 60%);
      }
      main {
        position: relative; z-index: 1; flex: 1;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        text-align: center; padding: clamp(2.5rem, 8vh, 5rem) 1.25rem 2rem;
      }
      /* The logo, a slow orbit and a gentle glow: activity, never a spinner. */
      .mark { position: relative; width: clamp(9rem, 34vw, 12rem); aspect-ratio: 1; margin-bottom: clamp(1.75rem, 5vh, 2.75rem); }
      .mark .glow {
        position: absolute; inset: 12%; border-radius: 50%;
        background: radial-gradient(circle, hsl(0 0% 100% / 0.16) 0%, transparent 70%);
        animation: glow 4.5s ease-in-out infinite;
      }
      .mark svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
      .mark .ring { fill: none; stroke: var(--border); stroke-width: 1; }
      .mark .arc { fill: none; stroke: hsl(0 0% 80% / 0.55); stroke-width: 1.25; stroke-linecap: round; stroke-dasharray: 60 254; }
      .mark .orbit { transform-origin: 50% 50%; transform-box: view-box; animation: orbit 14s linear infinite; }
      .mark .dot { fill: var(--foreground); }
      .mark img {
        position: absolute; inset: 22%; width: 56%; height: 56%; object-fit: contain;
        animation: pulse 4.5s ease-in-out infinite;
      }
      /* If the logo ever fails, the ring and glow keep their place and the alt text is shown and read out. */
      .mark img { color: var(--muted); font-size: 0.875rem; text-align: center; }
      h1 {
        font-family: var(--font-display); font-weight: 700; letter-spacing: -0.02em; line-height: 1.12;
        font-size: clamp(1.9rem, 6vw, 3.25rem); margin: 0 0 1rem; max-width: 18ch;
        animation: rise 0.9s ease-out both 0.1s;
      }
      .lede {
        margin: 0 0 1.75rem; max-width: 34rem; color: var(--muted); font-size: clamp(1rem, 2.6vw, 1.125rem);
        animation: rise 0.9s ease-out both 0.25s;
      }
      .status {
        display: inline-flex; align-items: center; gap: 0.6rem; margin: 0 0 2rem;
        padding: 0.45rem 1rem; border: 1px solid var(--border); border-radius: 999px; background: hsl(0 0% 5% / 0.7);
        font-size: 0.875rem; color: var(--foreground); letter-spacing: 0.01em;
        animation: rise 0.9s ease-out both 0.4s;
      }
      .status .pip { width: 0.5rem; height: 0.5rem; border-radius: 50%; background: var(--accent); animation: pip 2.4s ease-in-out infinite; }
      .actions { animation: rise 0.9s ease-out both 0.55s; }
      .retry {
        display: inline-flex; align-items: center; justify-content: center; gap: 0.5rem; min-height: 44px;
        padding: 0.6rem 1.4rem; border-radius: 0.75rem; border: 1px solid var(--border);
        color: var(--foreground); background: transparent; text-decoration: none; font: inherit; font-size: 0.9375rem;
        transition: background-color 0.2s, border-color 0.2s;
      }
      .retry:hover { background: hsl(0 0% 100% / 0.06); border-color: hsl(0 0% 30%); }
      .retry:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
      .retry[data-ready] { background: var(--foreground); color: var(--background); border-color: var(--foreground); }
      .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0; }
      footer {
        position: relative; z-index: 1; text-align: center; padding: 1.5rem 1.25rem 2rem;
        color: var(--muted); font-size: 0.875rem;
      }
      footer p { margin: 0.15rem 0; }
      footer .brand { font-family: var(--font-display); color: var(--foreground); letter-spacing: 0.04em; }
      @keyframes orbit { to { transform: rotate(360deg); } }
      @keyframes glow { 0%, 100% { opacity: 0.55; transform: scale(0.96); } 50% { opacity: 1; transform: scale(1.04); } }
      @keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.025); } }
      @keyframes breathe { 0%, 100% { opacity: 0.8; } 50% { opacity: 1; } }
      @keyframes pip { 0%, 100% { opacity: 0.35; } 50% { opacity: 1; } }
      @keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after { animation: none !important; transition: none !important; }
      }
    </style>
  </head>

      <p class="brand">Houcine.world</p>
    </footer>
    <script>
      // Progressive enhancement only: without this script the page reads the same and "Try again" opens the home page.
      (function () {
        "use strict";
        var retry = document.getElementById("retry");
        var statusText = document.getElementById("status-text");
        var announce = document.getElementById("announce");
        if (!retry || !window.fetch) return;

        // ?return=<path> comes from the boot watchdog. Only an address on this same site is accepted.
        var target = "/";
        try {
          var ret = new URLSearchParams(location.search).get("return");
          if (ret && ret.charAt(0) === "/" && ret.charAt(1) !== "/" && ret.charAt(1) !== "\\") {
            var u = new URL(ret, location.origin);
            if (u.origin === location.origin && u.pathname.indexOf("/maintenance") !== 0) target = u.pathname + u.search + u.hash;
          }
        } catch (e) { target = "/"; }
        retry.setAttribute("href", target);

        // The "back" check: the real home page (not this page) AND its main script both answer. One check at a
        // time, spaced out (30 s, doubling to 5 min), only while the tab is visible, at most 12 checks. It never
        // reloads the page by itself: it only says so and the visitor chooses.
        var delay = 30000, tries = 0, timer = 0, busy = false, back = false;
        function schedule() {
          clearTimeout(timer);
          if (back || tries >= 12 || document.hidden) return;
          timer = setTimeout(check, delay);
          delay = Math.min(delay * 2, 300000);
        }
        function get(url) {
          return fetch(url, { cache: "no-store", credentials: "same-origin", redirect: "follow" });
        }
        function check() {
          if (busy || back) return;
          busy = true; tries += 1;
          get("/?houcine-check=" + Date.now())
            .then(function (r) { return r.ok ? r.text() : ""; })
            .then(function (html) {
              if (!html || html.indexOf("data-houcine-fallback") !== -1 || html.indexOf('id="root"') === -1) return false;
              var m = html.match(/<script[^>]+type="module"[^>]+src="(\/[^"]+\.js)"/);
              if (!m) return false;
              return get(m[1]).then(function (r) {
                var type = r.headers.get("content-type") || "";
                return r.ok && /javascript/i.test(type);
              });
            })
            .then(function (ok) {
              if (!ok) return;
              back = true;
              statusText.textContent = "Ready again";
              retry.textContent = "Return to Houcine.world";
              retry.setAttribute("data-ready", "");
              announce.textContent = "Houcine.world is ready again.";
            })
            .catch(function () { /* still away: try later */ })
            .then(function () { busy = false; schedule(); });
        }
        document.addEventListener("visibilitychange", function () {
          if (!document.hidden && !back && !busy) { delay = 30000; schedule(); } else if (document.hidden) clearTimeout(timer);
        });
        schedule();
      })();
    </script>
  </body>
</html>
