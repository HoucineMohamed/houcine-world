# pcdkfpardswfwoiclvtm is the ONLY correct Supabase project for this app.
# This value (and the matching one in .env) has been silently overwritten to
# a different, inaccessible project (uxixfhthdgwxqfltvudt) TWICE by Lovable's
# own auto-commit bot (gpt-engineer-app), breaking the live site both times.
# If this ever shows anything other than pcdkfpardswfwoiclvtm, treat it as
# that regression recurring, not an intentional change, and revert it.
# CI (guard-supabase-project.yml) fails the build if this drifts.
project_id = "pcdkfpardswfwoiclvtm"

[functions.send-notification]
verify_jwt = false

# instagram-oauth serves both the authenticated "start connection" call and
# Instagram's own unauthenticated callback redirect from one router, so JWT
# verification happens inside the function instead of at the gateway.
[functions.instagram-oauth]
verify_jwt = false

[functions.instagram-metrics]
verify_jwt = true

# Same reasoning as instagram-oauth: each *-oauth function's /callback route is
# hit directly by the provider with no Authorization header.
[functions.tiktok-oauth]
verify_jwt = false

[functions.tiktok-metrics]
verify_jwt = true

[functions.spotify-oauth]
verify_jwt = false

[functions.spotify-metrics]
verify_jwt = true

[functions.soundcloud-oauth]
verify_jwt = false

[functions.soundcloud-metrics]
verify_jwt = true

[functions.platform-credentials]
verify_jwt = true