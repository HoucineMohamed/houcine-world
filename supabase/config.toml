# pcdkfpardswfwoiclvtm is the ONLY correct Supabase project for this app.
# This value (and the matching one in .env) has been silently overwritten to
# a different, inaccessible project (uxixfhthdgwxqfltvudt) TWICE by Lovable's
# own auto-commit bot (gpt-engineer-app), breaking the live site both times.
# If this ever shows anything other than pcdkfpardswfwoiclvtm, treat it as
# that regression recurring, not an intentional change, and revert it.
# CI (guard-supabase-project.yml) fails the build if this drifts.
project_id = "pcdkfpardswfwoiclvtm"

[functions.send-notification]
verify_jwt = false

# Public chat widget, no sign-in: any site visitor can use it, same reasoning as send-notification.
[functions.concierge]
verify_jwt = false

# instagram-oauth serves both the authenticated "start connection" call and
# Instagram's own unauthenticated callback redirect from one router, so JWT
# verification happens inside the function instead of at the gateway.
[functions.instagram-oauth]
verify_jwt = false

[functions.instagram-metrics]
verify_jwt = true

# Same reasoning as instagram-oauth: each *-oauth function's /callback route is
# hit directly by the provider with no Authorization header.
[functions.tiktok-oauth]
verify_jwt = false

[functions.tiktok-metrics]
verify_jwt = true

[functions.spotify-oauth]
verify_jwt = false

[functions.spotify-metrics]
verify_jwt = true

[functions.soundcloud-oauth]
verify_jwt = false

[functions.soundcloud-metrics]
verify_jwt = true

[functions.platform-credentials]
verify_jwt = true

# Knowledge Studio's private backend: the gateway checks the sign-in token, then the function itself requires a
# super admin (is_super_admin()) before anything is read (docs/knowledge-studio.md).
[functions.knowledge-studio]
verify_jwt = true

# meta-business-token/metrics are plain authenticated POST endpoints — no
# provider calls back to these directly (the token is pasted manually), so
# unlike the *-oauth functions above there's no unauthenticated callback
# route to accommodate.
[functions.meta-business-token]
verify_jwt = true

[functions.meta-business-metrics]
verify_jwt = true

# The Command Center's AI management analyst: the gateway checks the sign-in token; the function reads only what the
# signed-in user's own rights allow (row-level security), docs/command-center.md.
[functions.command-analyst]
verify_jwt = true

# Autopilot's AI side (monitoring runs, AI jobs, the operations assistant): the gateway checks the sign-in token; the
# function acts as the signed-in user (row-level security), docs/autopilot.md.
[functions.autopilot]
verify_jwt = true

# Client OS AI (client assistant in /portal, intelligence assistant in /workspace/clients): signed-in users only;
# the function acts as the signed-in user (row-level security), docs/client-os-ai.md.
[functions.client-os-ai]
verify_jwt = true
